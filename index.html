const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,11);

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moneyP=n=>'£'+(+n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const dateTime=ts=>{if(!ts)return '—';return new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const isoDate=ts=>{if(!ts)return '';return new Date(ts).toISOString().slice(0,10)};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

// IDB
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','clients','advisers','firms','documents'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
function idbDel(s,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(k);tx.oncomplete=()=>res(true)})}

async function loadAll(){
  if(!db)await openDB();
  const[firms,advisers,clients,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('advisers'),idbGetAll('clients'),idbGetAll('audit'),idbGet('state','ui')]);
  state.firm=firms[0]||null;state.advisers=advisers;state.clients=clients;
  state.audit=auditArr.sort((a,b)=>a.i-b.i);
  if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.brandName=uiState.brand||'FallMortgageOnboard';state.settings=Object.assign({},state.settings,uiState.settings||{});}
}
async function persistUI(){if(!db)await openDB();await idbPut('state',{value:{...state.ui,wizard:null},brand:state.brandName,settings:state.settings},'ui')}

// Audit (Mansoor P3)
async function auditLog(action,opts={}){
  if(!state.settings.auditChain)return;if(!db)await openDB();
  const prev=state.audit.length?state.audit[state.audit.length-1]:null;
  const prevHash=prev?prev.docHash:'';const i=(prev?prev.i:0)+1;
  const payload=opts.payload||{};
  const entry={id:uid('au'),i,ts:now(),tool:TOOLNAME,adviserId:opts.adviserId||state.ui.activeAdviserId||'',clientId:opts.clientId||'',action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,prevHash,docHash:'',payload};
  entry.docHash=await sha256(JSON.stringify({i,ts:entry.ts,action,clientId:entry.clientId,prevHash,payload}));
  state.audit.push(entry);await idbPut('audit',entry);
}

// BroadcastChannel mesh
let bcMortgage,bcClient,bcSignal;
function broadcast(ch,type,payload){if(!state.settings.autoBroadcast||!ch)return;try{ch.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload})}catch(e){}}
function initMesh(){
  try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()});bcSignal.addEventListener('message',e=>{const m=e.data;if(!m)return;if(m.type==='ping')bcSignal.postMessage({source:TOOLNAME,type:'pong',prime:PRIME})})}catch(e){}
  try{bcMortgage=new BroadcastChannel('fall-mortgage');bcMortgage.addEventListener('message',handleMortgageMsg);bcMortgage.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME,payload:{wants:['clients','advisers','firm']}})}catch(e){}
  try{bcClient=new BroadcastChannel('fall-client');bcClient.addEventListener('message',handleClientMsg)}catch(e){}
}
async function handleMortgageMsg(e){
  const m=e.data;if(!m||m.source===TOOLNAME)return;let dirty=false;
  if(m.type==='sync.snapshot'){
    const p=m.payload||{};
    if(Array.isArray(p.clients))for(const c of p.clients){const idx=state.clients.findIndex(x=>x.id===c.id);if(idx>=0){if((c.updatedAt||0)>=(state.clients[idx].updatedAt||0)){state.clients[idx]=c;await idbPut('clients',c);dirty=true;}}else{state.clients.push(c);await idbPut('clients',c);dirty=true;}}
    if(p.firm&&(!state.firm||(p.firm.updatedAt||0)>(state.firm.updatedAt||0))){state.firm=p.firm;await idbPut('firms',p.firm);dirty=true;}
  }else if(m.type==='sync.request'){
    broadcast(bcMortgage,'sync.snapshot',{clients:state.clients,advisers:state.advisers,firm:state.firm});
  }
  if(dirty)render();
}
async function handleClientMsg(e){
  const m=e.data;if(!m||m.source===TOOLNAME)return;
  if(m.type==='client.created'||m.type==='client.updated'){
    const c=m.payload;if(c&&c.id){const idx=state.clients.findIndex(x=>x.id===c.id);if(idx>=0)state.clients[idx]=c;else state.clients.push(c);await idbPut('clients',c);render();}
  }
}

function clientDisplayName(c){
  const a1=c.applicant1||{};
  const name=(a1.title?a1.title+' ':'')+(a1.firstName||'')+' '+(a1.lastName||'');
  if(c.applicationType==='joint'){
    const a2=c.applicant2||{};
    const name2=(a2.firstName||'')+' '+(a2.lastName||'');
    if(name2.trim())return name.trim()+' & '+name2.trim();
  }
  return name.trim()||'Unnamed';
}

// Risk scoring
function assessAmlRisk(c){
  const aml=c.aml||{};let score=0;const reasons=[];
  if(aml.pepStatus){score+=3;reasons.push('PEP');}
  if(aml.sanctionsMatch){score+=4;reasons.push('sanctions match');}
  if(!aml.sanctionsChecked){score+=1;reasons.push('sanctions unchecked');}
  const nat=(c.applicant1?.nationality||'').toUpperCase();
  if(HIGH_RISK_JURIS.includes(nat)){score+=3;reasons.push('high-risk nationality');}
  if(aml.sourceOfDeposit==='gift'&&!aml.giftLetter){score+=2;reasons.push('gift without letter');}
  if(aml.sourceOfDeposit==='overseas'){score+=2;reasons.push('overseas source of deposit');}
  if(aml.depositAmount>100000){score+=1;reasons.push('deposit >£100k');}
  const grade=score>=5?'high':score>=2?'medium':'low';
  return {grade,score,reasons};
}

// Save helpers
async function saveClient(c,action,reasoning){
  c.updatedAt=now();const risk=assessAmlRisk(c);c.aml.riskGrade=risk.grade;c.aml.riskReasons=risk.reasons;
  const idx=state.clients.findIndex(x=>x.id===c.id);
  if(idx>=0)state.clients[idx]=c;else state.clients.push(c);
  await idbPut('clients',c);
  await auditLog(action||'client.updated',{clientId:c.id,reasoning:reasoning||'',payload:{status:c.status}});
  broadcast(bcMortgage,'client.updated',c);broadcast(bcClient,'client.updated',c);
}
async function saveFirm(f,reasoning){
  f.updatedAt=now();state.firm=f;await idbPut('firms',f);
  await auditLog('firm.updated',{reasoning:reasoning||''});
  broadcast(bcMortgage,'firm.updated',f);
}
async function saveAdviser(a,reasoning){
  a.updatedAt=now();const idx=state.advisers.findIndex(x=>x.id===a.id);
  if(idx>=0)state.advisers[idx]=a;else state.advisers.push(a);
  await idbPut('advisers',a);
  await auditLog('adviser.updated',{reasoning:reasoning||'',payload:{adviserId:a.id}});
}
async function storeDocument(file,clientId,docType){
  const buf=await file.arrayBuffer();const hash=await sha256(new TextDecoder().decode(new Uint8Array(buf).slice(0,1024)));
  const meta={id:uid('doc'),clientId,type:docType,name:file.name,size:file.size,sha256:hash.slice(0,16),uploadedAt:now(),expiresAt:null};
  const dt=DOC_TYPES.find(d=>d.id===docType);
  if(dt)meta.expiresAt=now()+dt.expiry*86400000;
  const cl=state.clients.find(c=>c.id===clientId);
  if(cl){cl.documents.push(meta);await saveClient(cl,'document.uploaded','uploaded '+docType);}
  toast('Document captured');
}

// RENDER
function render(){
  renderTabs();const v=$('#view');
  if(state.ui.wizard){renderWizard(v);return;}
  switch(state.active){
    case 'dashboard':return renderDashboard(v);
    case 'clients':return state.ui.selectedClientId?renderClientDetail(v):renderClientList(v);
    case 'firm':return renderFirm(v);
    case 'advisers':return renderAdvisers(v);
    case 'help':return renderHelp(v);
    default:renderDashboard(v);
  }
}
function renderTabs(){
  const nav=$('#nav');
  nav.innerHTML=TABS.map(t=>{
    let count='';
    if(t.id==='clients')count=`<span class="tcount">${state.clients.filter(c=>!c.archivedAt).length}</span>`;
    return `<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.ico} ${t.name}${count}</button>`;
  }).join('');
  $('#brandName').textContent=state.brandName;
}
function switchTab(id){state.active=id;state.ui.selectedClientId=null;state.ui.wizard=null;persistUI();render();}

// CLIENT LIST
function renderClientList(v){
  const filter=state.ui.filter||'all';
  let cls=state.clients.filter(c=>!c.archivedAt);
  if(filter==='new')cls=cls.filter(c=>c.status==='new');
  else if(filter==='in-progress')cls=cls.filter(c=>c.status==='in-progress');
  else if(filter==='complete')cls=cls.filter(c=>c.status==='complete');
  else if(filter==='aml-due')cls=cls.filter(c=>!c.aml?.cddComplete);
  else if(filter==='high-risk')cls=cls.filter(c=>c.aml?.riskGrade==='high');
  else if(filter==='vulnerable')cls=cls.filter(c=>c.vulnerable?.identified);
  const q=(state.ui.search||'').toLowerCase();
  if(q)cls=cls.filter(c=>clientDisplayName(c).toLowerCase().includes(q));
  cls.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  v.innerHTML=`
    <div class="section-h"><h2>Clients</h2><div class="sub">${cls.length} shown</div></div>
    <div class="chip-row">
      ${['all','new','in-progress','complete','aml-due','high-risk','vulnerable'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}
    </div>
    <div class="field" style="max-width:400px;margin-bottom:14px"><input placeholder="Search…" value="${esc(state.ui.search||'')}" oninput="state.ui.search=this.value;render()"></div>
    ${cls.length?`<table><thead><tr><th>Name</th><th>Type</th><th>Status</th><th>AML</th><th>Updated</th></tr></thead><tbody>${
      cls.map(c=>`<tr class="row-link" onclick="openClient('${c.id}')"><td>${esc(clientDisplayName(c))}${c.isDemo?' <span class="tag muted">demo</span>':''}</td><td>${esc(c.applicationType)}</td><td><span class="tag ${c.status==='complete'?'green':c.status==='in-progress'?'amber':'muted'}">${c.status}</span></td><td><span class="tag ${c.aml?.riskGrade==='high'?'red':c.aml?.riskGrade==='medium'?'amber':'green'}">${c.aml?.riskGrade||'—'}</span>${c.aml?.cddComplete?'':' <span class="tag ox">CDD due</span>'}</td><td>${dateStr(c.updatedAt)}</td></tr>`).join('')
    }</tbody></table>`:'<div class="empty"><div class="big">No matching clients</div></div>'}`;
}
function setFilter(f){state.ui.filter=f;render();}
function openClient(id){state.ui.selectedClientId=id;state.active='clients';state.ui.clientSubtab='overview';render();}

async function archiveClient(id){
  if(!confirm('Archive this client?'))return;
  const c=state.clients.find(x=>x.id===id);if(!c)return;
  c.archivedAt=now();await saveClient(c,'client.archived','user archived');
  state.ui.selectedClientId=null;toast('Archived');render();
}

// WIZARD
function newClient(){
  const c=newClientRec();c.adviserId=state.ui.activeAdviserId||'';
  state.ui.wizard={clientId:c.id,step:0,client:c,fresh:true};
  render();
}
function resumeWizard(id){
  const c=state.clients.find(x=>x.id===id);if(!c)return;
  state.ui.wizard={clientId:c.id,step:0,client:JSON.parse(JSON.stringify(c)),fresh:false};
  render();
}

function renderWizard(v){
  const w=state.ui.wizard;if(!w)return;
  const c=w.client;const step=w.step;
  const steps=c.applicationType==='sole'?WIZARD_STEPS.filter(s=>s.id!=='applicant2'):WIZARD_STEPS;
  const cur=steps[step]||steps[0];
  v.innerHTML=`
    <div class="wizard">
      <div class="wizard-steps">${steps.map((s,i)=>`<div class="wstep ${i<step?'done':''} ${i===step?'active':''}" onclick="jumpStep(${i})"><span class="n">${s.n}</span>${s.name}</div>`).join('')}</div>
      <div class="wizard-body" id="wizBody"></div>
      <div class="wizard-foot">
        <button class="btn ghost" onclick="${step>0?'prevStep()':'cancelWizard()'}">${step>0?'← Back':'Cancel'}</button>
        <button class="btn primary" onclick="${step<steps.length-1?'nextStep()':'commitWizard()'}">${step<steps.length-1?'Next →':'Commit'}</button>
      </div>
    </div>`;
  renderWizardStep(cur.id,c);
}

async function handleFiles(files){
  if(!files||!files.length)return;
  const w=state.ui.wizard;if(!w)return;
  const docType=$('#wDocType')?.value||'other';
  for(const file of files){
    const buf=await file.arrayBuffer();const hash=await sha256(new TextDecoder().decode(new Uint8Array(buf).slice(0,1024)));
    const meta={id:uid('doc'),clientId:w.clientId,type:docType,name:file.name,size:file.size,sha256:hash.slice(0,16),uploadedAt:now(),expiresAt:null};
    const dt=DOC_TYPES.find(d=>d.id===docType);if(dt)meta.expiresAt=now()+dt.expiry*86400000;
    w.client.documents.push(meta);
  }
  toast(files.length+' file(s) captured');
  const list=$('#wizDocList');
  if(list)list.innerHTML=w.client.documents.map(d=>`<div class="doc-row"><span class="dtype">${esc(d.type)}</span><span class="dname">${esc(d.name)}</span><span class="dmeta">${dateStr(d.uploadedAt)}</span><span class="dhash">${esc(d.sha256)}</span></div>`).join('');
}

function collectStep(stepId,c){

      c.applicant1.title=$('#wA1Title')?.value||'';c.applicant1.firstName=$('#wA1First')?.value.trim()||'';

    case 'applicant2':
      c.applicant2.title=$('#wA2Title')?.value||'';c.applicant2.firstName=$('#wA2First')?.value.trim()||'';
      c.applicant2.lastName=$('#wA2Last')?.value.trim()||'';c.applicant2.dob=$('#wA2Dob')?.value||'';
      c.applicant2.niNumber=$('#wA2Ni')?.value.trim()||'';c.applicant2.maritalStatus=$('#wA2Marital')?.value||'';break;

      c.contact.email=$('#wEmail')?.value.trim()||'';c.contact.yearsAtAddress=parseInt($('#wYears')?.value)||0;
      c.property={address:$('#wPropAddr')?.value.trim()||'',postcode:$('#wPropPost')?.value.trim()||'',
        value:parseFloat($('#wPropVal')?.value)||0,type:$('#wPropType')?.value||'',tenure:$('#wTenure')?.value||'freehold',source:'purchase'};break;
    case 'employment':

      }break;
    case 'expenditure':
      c.expenditure={mortgage:parseFloat($('#wExMort')?.value)||0,rent:parseFloat($('#wExRent')?.value)||0,
        loans:parseFloat($('#wExLoans')?.value)||0,creditCards:parseFloat($('#wExCC')?.value)||0,
        childcare:parseFloat($('#wExChild')?.value)||0,schoolFees:parseFloat($('#wExSchool')?.value)||0,
        maintenance:parseFloat($('#wExMaint')?.value)||0,travel:parseFloat($('#wExTravel')?.value)||0,
        utilities:parseFloat($('#wExUtil')?.value)||0,insurance:parseFloat($('#wExIns')?.value)||0,
        other:parseFloat($('#wExOther')?.value)||0,dependants:parseInt($('#wDeps')?.value)||0,
        dependantAges:$('#wDepAges')?.value.trim()||''};break;
    case 'credit':
      ['adverse','ccjs','defaults','iva','bankruptcy','missedPayments','paydayLoans'].forEach(k=>{c.credit[k]=$('#wCr_'+k)?.checked||false;});
      c.credit.notes=$('#wCrNotes')?.value.trim()||'';break;
    case 'demands':

        term:parseInt($('#wDnTerm')?.value)||25,repayment:$('#wDnRepay')?.value||'capital-and-interest',

      c.aml.sourceOfDeposit=$('#wSoD')?.value||'';c.aml.depositAmount=parseFloat($('#wDepAmt')?.value)||0;
      c.aml.giftLetter=$('#wGiftLetter')?.checked||false;c.aml.giftorName=$('#wGiftorName')?.value.trim()||'';
      c.aml.giftorRelationship=$('#wGiftorRel')?.value.trim()||'';

      c.aml.pepStatus=$('#wPep')?.checked||false;c.aml.cddComplete=$('#wCddDone')?.checked||false;
      c.aml.notes=$('#wAmlNotes')?.value.trim()||'';break;
    case 'vulnerable':

function getSteps(c){return c.applicationType==='sole'?WIZARD_STEPS.filter(s=>s.id!=='applicant2'):WIZARD_STEPS;}
function nextStep(){
  const w=state.ui.wizard;if(!w)return;
  const steps=getSteps(w.client);collectStep(steps[w.step].id,w.client);
  if(w.step<steps.length-1){w.step++;render();}
}
function prevStep(){const w=state.ui.wizard;if(!w)return;const steps=getSteps(w.client);collectStep(steps[w.step].id,w.client);if(w.step>0){w.step--;render();}}
function jumpStep(i){const w=state.ui.wizard;if(!w)return;const steps=getSteps(w.client);collectStep(steps[w.step].id,w.client);w.step=i;render();}
function cancelWizard(){if(!confirm('Cancel? Unsaved changes will be lost.'))return;state.ui.wizard=null;render();}

async function commitWizard(){
  const w=state.ui.wizard;if(!w)return;
  const steps=getSteps(w.client);collectStep(steps[w.step].id,w.client);
  const c=w.client;
  if(!c.applicant1.firstName||!c.applicant1.lastName){toast('Applicant 1 name required');return;}
  c.status=c.aml?.cddComplete&&c.lenderPackage?.complete?'complete':'in-progress';
  c.adviserId=state.ui.activeAdviserId||'';
  await saveClient(c,w.fresh?'client.created':'client.updated',w.fresh?'wizard commit — new client':'wizard commit — updated');
  state.ui.wizard=null;state.ui.selectedClientId=c.id;state.active='clients';
  toast('Client committed');persistUI();render();
}

// HELP — T0 + T3
const T0_RULES=[
  {q:/fact.?find|onboard/i,a:'The mortgage fact-find must capture sufficient information to make a suitable recommendation per MCOB 4.7A. This includes: personal details, employment and income, expenditure and commitments, credit history, demands and needs, deposit source, and any vulnerability. Retain for 7 years per FCA SYSC.'},
  {q:/aml|money launder|cdd|kyc/i,a:'Under MLR 2017, mortgage brokers must conduct CDD on all clients: verify identity (passport/driving licence), verify address (utility bill/bank statement), assess source of deposit (especially gifts and overseas funds), screen against sanctions lists, and check PEP status. Enhanced due diligence for high-risk clients.'},
  {q:/source of deposit|gift|deposit/i,a:'Lenders and MLR 2017 require evidence of the deposit source. For savings: bank statements showing accumulation. For gifts: a signed gift letter confirming no repayment obligation, and proof of the giftor\'s source of funds. For equity: latest mortgage statement + valuation. For overseas funds: additional scrutiny under JMLSG Part II.'},
  {q:/vulnerab/i,a:'FCA FG21/1 defines vulnerability across four categories: health, life events, resilience, and capability. Document the vulnerability, adjustments made, and communication preferences. Review at each material interaction. Mortgage decisions are high-impact — ensure the client has adequate time and support to make informed choices.'},
  {q:/affordab|stress|expenditure/i,a:'Under MCOB 11.6.18R, the lender must stress-test affordability. The broker should capture comprehensive expenditure data including: existing debts, childcare, school fees, maintenance obligations, and general living costs. ONS benchmarks are used as a minimum by many lenders. Document total committed expenditure vs net disposable income.'},
  {q:/credit|adverse|ccj|default/i,a:'Full credit disclosure is essential. Lenders will hard-search via Experian/Equifax/TransUnion. Undisclosed adverse credit discovered at application wastes time and damages the client relationship. Common adverse markers: CCJs (satisfied or not, <6 years), defaults, IVAs, bankruptcy (discharged or not), missed payments, and payday loans.'},
  {q:/demand|need|mcob 4/i,a:'MCOB 4.7A requires the adviser to assess the client\'s demands and needs before making a recommendation. Key areas: type of mortgage (purchase/remortgage/product switch), loan amount, term, repayment type, and priorities (rate vs certainty vs flexibility vs portability). Document these before sourcing.'},
  {q:/document|passport|payslip|evidence/i,a:'Standard lender requirements: ID (passport/driving licence), address proof (utility bill/bank statement <3 months), income evidence (payslips ×3 / P60 / SA302 / accountant\'s accounts), bank statements ×3, deposit evidence, current mortgage statement (remortgage), property details, and EPC. Hash all documents for audit trail integrity.'},
  {q:/pep|sanction/i,a:'PEP (Politically Exposed Person) status requires enhanced due diligence under MLR 2017. Sanctions screening must be conducted against the HM Treasury consolidated list. A sanctions match requires immediate reporting to the NCA and must not proceed. PEP status does not prohibit the transaction but requires enhanced scrutiny of source of funds.'},
  {q:/retention|record|7 year/i,a:'FCA SYSC requires firms to retain all client records, advice records, and transaction records for a minimum of 7 years from the end of the business relationship. This includes the fact-find, suitability report, correspondence, complaints, and audit trail. FallMortgageOnboard stores everything in IndexedDB with JSON export for backup.'},
];
function askT0(q){for(const r of T0_RULES){if(r.q.test(q))return {answer:r.a,source:'T0 · MCOB/MLR/FG21 rules'};}return null;}
async function askT3(q){
  const keys=[{k:state.settings.anthropicKey,name:'Anthropic',url:'https://api.anthropic.com/v1/messages',body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:'You are a UK mortgage regulation expert. Answer concisely.\n\n'+q}]}),headers:{'x-api-key':'KEY','anthropic-version':'2023-06-01','content-type':'application/json'},parse:r=>r.content?.[0]?.text}];
  for(const p of keys){if(!p.k)continue;try{const hdrs={};for(const[hk,hv]of Object.entries(p.headers))hdrs[hk]=hv.replace('KEY',p.k);const res=await fetch(p.url,{method:'POST',headers:hdrs,body:p.body});if(!res.ok)continue;const json=await res.json();const text=p.parse(json);if(text)return {answer:text,source:'T3 · '+p.name};}catch(e){}}return null;
}
function renderHelp(v){
  const msgs=state.ui.chat||[];
  v.innerHTML=`<div class="section-h"><h2>Mortgage Onboarding Q & A</h2><div class="sub">T0 + T3 BYOK</div></div>
    <p style="font-size:12px;color:var(--cream-dim);margin-bottom:14px">Ask about fact-finding, AML CDD, source of deposit, vulnerability, affordability, credit, demands & needs, document requirements, PEP/sanctions, record retention.</p>
    <div class="card" style="max-width:780px">
      <div class="chat" id="chatBox">${msgs.map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div>
      <div class="chat-input"><input id="chatIn" placeholder="Ask…" onkeydown="if(event.key==='Enter')askQuestion()"><button class="btn primary" onclick="askQuestion()">Ask</button></div>
    </div>`;
  const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight;
}
async function askQuestion(){
  const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';
  if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();
  let r=askT0(q);if(!r)r=await askT3(q);
  state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add a BYOK key in Settings for T3.',source:'system'});
  persistUI();render();
}

  persistUI();closeModal();toast('Settings saved');render();
}

async function verifyChain(){
  let ok=true;
  for(let i=0;i<state.audit.length;i++){const e=state.audit[i];const ph=i>0?state.audit[i-1].docHash:'';if(e.prevHash!==ph){ok=false;break;}const exp=await sha256(JSON.stringify({i:e.i,ts:e.ts,action:e.action,clientId:e.clientId,prevHash:e.prevHash,payload:e.payload}));if(e.docHash!==exp){ok=false;break;}}
  toast(ok?'Chain verified ✓':'Chain broken');
}
function exportAudit(){const b=new Blob([JSON.stringify(state.audit,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallmortgageonboard-audit.json';a.click();URL.revokeObjectURL(u);toast('Exported');}

function importState(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm);}for(const k of['advisers','clients']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r);}}await persistUI();toast('Imported');render();}catch(e){toast('Failed');}};inp.click();}
async function wipeState(){if(!confirm('Wipe ALL data?'))return;if(!confirm('Sure?'))return;for(const s of['firms','advisers','clients','audit','documents','state']){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r;});}state={active:'dashboard',brandName:'FallMortgageOnboard',firm:null,advisers:[],clients:[],audit:[],ui:{filter:'all',search:'',selectedClientId:null,activeAdviserId:null,wizard:null,chat:[],clientSubtab:'overview'},settings:{anthropicKey:'',openaiKey:'',auditChain:true,autoBroadcast:true}};toast('Wiped');render();}
